version: "3.8"

# ─── PPLG Laser CNC — Frontend Only ─────────────────────────────────────────
# Backend sudah jalan di: https://backlaser.pplgsmkn4.my.id
#
# Usage:
#   ./run-podman.sh up       → build & jalankan frontend
#   ./run-podman.sh down     → stop
#   ./run-podman.sh logs     → lihat log
#   ./run-podman.sh restart  → restart
#
# ⚠️  Sebelum pertama kali run: cp .env.example .env

services:

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Containerfile
    container_name: pplg-frontend
    restart: unless-stopped
    environment:
      # Next.js proxy /api/* ke backend eksternal (dibaca oleh next.config.mjs)
      BACKEND_URL: ${BACKEND_URL:-https://backlaser.pplgsmkn4.my.id}
      NEXT_PUBLIC_ADMIN_SECRET: ${ADMIN_SECRET:-pplglaser}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
